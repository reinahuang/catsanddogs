# 1. 应用一：专门对账业务微服务与应用资源 (k8s 目录)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catsanddogs-workloads
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'git@github.com:reinahuang/catsanddogs.git'
    targetRevision: main
    path: 'k8s'                          # 精准监控 k8s 目录[cite: 2, 6]
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default                  # 部署到业务命名空间
  syncPolicy:
    automated:
      prune: true                       # 自动清理[cite: 4]
      selfHeal: true                    # 自动修复漂移
---
# 2. 应用二：专门对账集群基础设施与 Ingress/网关配置 (argocd 目录)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catsanddogs-infra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'git@github.com:reinahuang/catsanddogs.git'
    targetRevision: main
    path: 'argocd'                       # 精准监控 argocd 目录[cite: 3]
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd                   # 部署到 argocd 命名空间
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
