#04-ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: example-ingress
  namespace: example
spec:
  ingressClassName: nginx ##增加ingressClassName字段，指定使用nginx ingress controller
  rules:
  - host: example.local
    http:
      paths:
      # API 路由转发给 Backend
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8080
      # 页面路由转发给 Frontend
      - path: /cat
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
      - path: /dog
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80